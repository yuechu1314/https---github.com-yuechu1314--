<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小可 · Web SDK 接入测试</title>
<style>
    :root {
        --blue-deep: #334b83; --blue-mid: #4a63a3; --blue-soft: #b1bfe0;
        --pink: #ea6181; --ink: #24304f; --ink-soft: #475471;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif; color: var(--ink);
        background: #f5f7fd;
    }
    .bar {
        padding: 14px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        background: #fff; box-shadow: 0 2px 16px rgba(51,75,131,0.08); z-index: 2;
    }
    .bar h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--blue-deep); }
    input {
        padding: 9px 12px; font-size: 13px; border: 1px solid #dfe4f2; border-radius: 10px;
        outline: none; background: #fafbff; min-width: 320px;
    }
    input:focus { border-color: var(--blue-soft); box-shadow: 0 0 0 3px rgba(177,191,224,0.25); }
    button {
        border: 0; cursor: pointer; font-size: 13px; font-weight: bold; padding: 9px 18px;
        border-radius: 999px; font-family: inherit; color: #fff;
        background: linear-gradient(135deg, var(--blue-mid), var(--blue-deep));
        box-shadow: 0 6px 16px rgba(51,75,131,0.25);
    }
    button.ghost { background: #f2f5fc; color: var(--blue-deep); box-shadow: none; }
    .status { font-size: 12px; color: var(--pink); font-weight: bold; margin-left: auto; }
    .stage { flex: 1; position: relative; overflow: hidden; }
    #sdk { width: 100%; height: 100%; border: 0; }
    .tip {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        text-align: center; color: var(--ink-soft); font-size: 13px; line-height: 2; padding: 30px;
    }
</style>
</head>
<body>
<div class="bar">
    <h1>小可 · Web SDK 测试</h1>
    <input id="token" type="password" placeholder="粘贴访问令牌（czs_ 或 pat_ 开头，只存本机）">
    <button id="start">启动</button>
    <button class="ghost" id="clear">清空</button>
    <span class="status" id="status"></span>
</div>
<div class="stage">
    <div id="sdk"></div>
    <div class="tip" id="tip">
        projectId 已经填好（7703769752451399722）<br>
        把令牌填到上面，点「启动」，这里就会出现真正的聊天界面
    </div>
</div>

<script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
<script>
    var PROJECT_ID = '7703769752451399722';
    var tokenInput = document.getElementById('token');
    var statusEl = document.getElementById('status');
    var tip = document.getElementById('tip');
    var started = false;

    try { tokenInput.value = localStorage.getItem('xk_wsdk_token') || ''; } catch (e) {}

    function say(msg) { statusEl.textContent = msg || ''; }

    function mask(t) {
        if (!t) return '';
        if (t.length <= 14) return t;
        return t.slice(0, 8) + '…' + t.slice(-4) + '（共 ' + t.length + ' 位）';
    }

    function showSaved() {
        var t = '';
        try { t = localStorage.getItem('xk_wsdk_token') || ''; } catch (e) {}
        if (t) {
            tip.innerHTML = '已保存令牌：' + mask(t) + '<br>点上面「启动」开始连接';
            say('本机已存令牌');
        }
    }

    showSaved();

    function start() {
        var token = tokenInput.value.trim();
        if (!token) { say('先把令牌填上'); return; }
        if (typeof cozeWebSDK === 'undefined') { say('SDK 脚本没加载成功，检查网络'); return; }
        try { localStorage.setItem('xk_wsdk_token', token); } catch (e) {}
        if (started && cozeWebSDK.destroy) { try { cozeWebSDK.destroy(); } catch (e) {} }

        say('初始化中…');
        cozeWebSDK.init({
            projectId: PROJECT_ID,
            container: document.getElementById('sdk'),
            style: 'width:100%;height:100%;border:0;',
            theme: 'light',
            refreshToken: function () { return Promise.resolve(token); },
            onIframeReady: function () { tip.style.display = 'none'; say('已就绪'); },
            onTokenInvalid: function () { say('令牌无效或权限不足'); },
            onTokenExpired: function () { say('令牌已过期'); },
            onNetworkError: function () { say('网络异常'); }
        });
        started = true;
    }

    document.getElementById('start').addEventListener('click', start);
    document.getElementById('clear').addEventListener('click', function () {
        try { localStorage.removeItem('xk_wsdk_token'); } catch (e) {}
        tokenInput.value = ''; say('已清空本地令牌');
    });
</script>
</body>
</html>
