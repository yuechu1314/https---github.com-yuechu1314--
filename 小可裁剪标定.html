<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小可 · 显示区域标定</title>
<style>
    :root { --blue-deep:#334b83; --blue-mid:#4a63a3; --blue-soft:#b1bfe0; --pink:#ea6181; --ink:#24304f; --ink-soft:#475471; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                 font-family: "Microsoft YaHei","微软雅黑",Arial,sans-serif; color: var(--ink); background: #eef1f9; }
    .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 10; min-height: 56px;
           display: flex; align-items: center; flex-wrap: wrap; gap: 14px; padding: 10px 18px;
           background: #fff; box-shadow: 0 2px 14px rgba(51,75,131,0.10); }
    .title { font-size: 14px; font-weight: bold; color: var(--blue-deep); white-space: nowrap; }
    .ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
    input[type=range] { width: 150px; accent-color: #334b83; }
    .val { display: inline-block; min-width: 56px; font-weight: bold; color: var(--blue-deep); }
    button { border: 0; cursor: pointer; font-size: 13px; font-weight: bold; padding: 9px 18px; border-radius: 999px;
             font-family: inherit; color: #fff; background: linear-gradient(135deg, var(--blue-mid), var(--blue-deep));
             box-shadow: 0 6px 16px rgba(51,75,131,0.25); white-space: nowrap; }
    button.ghost { background: #f2f5fc; color: var(--blue-deep); box-shadow: none; }
    /* 这个框的尺寸和主页小窗完全一致，所以这里调出来的数字可以直接用 */
    .stage { position: fixed; left: 50%; top: calc(50% + 32px); transform: translate(-50%, -50%);
             overflow: hidden; background: #fff; border: 2px dashed var(--pink);
             border-radius: 12px; box-shadow: 0 18px 50px rgba(51,75,131,0.18); }
    .stage iframe {
        position: absolute; border: 0; display: block; background: #fff;
    }
    .hintbar { position: fixed; right: 14px; bottom: 12px; z-index: 9; font-size: 12px; color: #fff;
               background: rgba(43,63,112,0.92); padding: 8px 12px; border-radius: 10px; }
</style>
</head>
<body>

<div class="bar">
    <div class="title">小可 · 显示区域标定</div>
    <div class="ctrl">左裁切 <input type="range" id="left" min="0" max="1200" step="4" value="420"><span class="val" id="leftVal">420px</span></div>
    <div class="ctrl">上裁切 <input type="range" id="top" min="0" max="600" step="4" value="0"><span class="val" id="topVal">0px</span></div>
    <div class="ctrl">下裁切 <input type="range" id="bottom" min="0" max="600" step="4" value="0"><span class="val" id="bottomVal">0px</span></div>
    <div class="ctrl">宽 <input type="range" id="width" min="320" max="1400" step="10" value="560"><span class="val" id="widthVal">560px</span></div>
    <div class="ctrl">高 <input type="range" id="height" min="400" max="1000" step="10" value="760"><span class="val" id="heightVal">760px</span></div>    <div class="ctrl">右裁切 <input type="range" id="right" min="0" max="600" step="4" value="0"><span class="val" id="rightVal">0px</span></div>
    <button onclick="openMain()">用这组参数打开主页</button>
    <button class="ghost" onclick="save()">只保存到本机</button>
    <button class="ghost" onclick="reset()">恢复默认</button>
</div>

<div class="stage" id="stage">
    <iframe id="frame" src="https://code.coze.cn/p/7703769752451399722/preview?link_share=true"></iframe>
</div>

<div class="hintbar" id="hintbar">这个虚线框和主页小窗一样大：拖滑块拖滑块把不要的部分挪出虚线框 → 点「用这组参数打开主页」</div>

<script>
    var frame = document.getElementById('frame');
    var stage = document.getElementById('stage');
    var leftEl = document.getElementById('left');
    var topEl = document.getElementById('top');
    var bottomEl = document.getElementById('bottom');
    var rightEl = document.getElementById('right');
    var widthEl = document.getElementById('width');
    var heightEl = document.getElementById('height');

    function num(k, d) {
        try { var v = parseInt(localStorage.getItem(k), 10); if (!isNaN(v) && v >= 0) return v; } catch (e) {}
        return d;
    }

    function apply() {
        var l = parseInt(leftEl.value, 10);
        var t = parseInt(topEl.value, 10);
        var b = parseInt(bottomEl.value, 10);
        var r = parseInt(rightEl.value, 10);
        document.getElementById('leftVal').textContent = l + 'px';
        document.getElementById('topVal').textContent = t + 'px';
        document.getElementById('bottomVal').textContent = b + 'px';
        document.getElementById('rightVal').textContent = r + 'px';
        // iframe 往左上挪，容器 overflow 裁掉挪出去的部分
        frame.style.left = (-l) + 'px';
        frame.style.top = (-t) + 'px';
        frame.style.width = (stage.clientWidth + l + r) + 'px';
        frame.style.height = (stage.clientHeight + t + b) + 'px';
    }

    function openMain() {
        var u = '网页主体.html#crop=' + leftEl.value + ',' + topEl.value + ',' + bottomEl.value + ',' + rightEl.value + '&size=' + widthEl.value + ',' + heightEl.value;
        window.open(u, '_blank');
        document.getElementById('hintbar').textContent =
            '已在新标签打开主页，参数：左 ' + leftEl.value + ' / 上 ' + topEl.value + ' / 下 ' + bottomEl.value;
    }
    function save() {
        try {
            localStorage.setItem('xk_crop_left', leftEl.value);
            localStorage.setItem('xk_crop_top', topEl.value);
            localStorage.setItem('xk_crop_bottom', bottomEl.value);
            localStorage.setItem('xk_crop_right', rightEl.value);
            localStorage.setItem('xk_size_w', widthEl.value);
            localStorage.setItem('xk_size_h', heightEl.value);
            document.getElementById('hintbar').textContent =
                '已保存：左 ' + leftEl.value + ' / 上 ' + topEl.value + ' / 下 ' + bottomEl.value + ' px —— 回主页 Ctrl+F5 生效';
        } catch (e) {
            document.getElementById('hintbar').textContent =
                '保存失败（浏览器限制），把这三个数告诉作者：左 ' + leftEl.value + ' / 上 ' + topEl.value + ' / 下 ' + bottomEl.value;
        }
    }

    function reset() {
        leftEl.value = 788; topEl.value = 108; bottomEl.value = 44; rightEl.value = 0; widthEl.value = 400; heightEl.value = 540; sizeStage();
        try { localStorage.removeItem('xk_crop_left'); localStorage.removeItem('xk_crop_top'); localStorage.removeItem('xk_crop_bottom'); localStorage.removeItem('xk_crop_right'); } catch (e) {}
        document.getElementById('hintbar').textContent = '已恢复默认（左 788 / 上 108 / 下 44 / 右 0，400x540）';
    }

    function sizeStage() {
        document.getElementById('widthVal').textContent = widthEl.value + 'px';
        document.getElementById('heightVal').textContent = heightEl.value + 'px';
        stage.style.width = parseInt(widthEl.value, 10) + 'px';
        stage.style.height = parseInt(heightEl.value, 10) + 'px';
        apply();
    }

    leftEl.value = num('xk_crop_left', 788);
    topEl.value = num('xk_crop_top', 108);
    bottomEl.value = num('xk_crop_bottom', 44);
    rightEl.value = num('xk_crop_right', 0);
    widthEl.value = num('xk_size_w', 400);
    heightEl.value = num('xk_size_h', 540);
    leftEl.addEventListener('input', apply);
    topEl.addEventListener('input', apply);
    bottomEl.addEventListener('input', apply);
    rightEl.addEventListener('input', apply);
    widthEl.addEventListener('input', sizeStage);
    heightEl.addEventListener('input', sizeStage);
    window.addEventListener('resize', sizeStage);
    sizeStage();
</script>
</body>
</html>
