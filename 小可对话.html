<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小可智能助手 · 福建卫职院百事通</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f7fd; }
    #frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    #tip {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font: 14px/2 "Microsoft YaHei", "微软雅黑", Arial, sans-serif; color: #6e7a99;
        text-align: center; pointer-events: none;
    }
</style>
</head>
<body>
    <div id="tip">正在连接小可…</div>
    <iframe id="frame" src="about:blank" title="小可智能助手" allow="microphone; camera; clipboard-read; clipboard-write"></iframe>
    <script>
        var XK_SDK_ORIGIN = 'https://sdk.coze.site';
        var XK_PROJECT_ID = '7703769752451399722';
        // 令牌写在前端，任何人查看源码都能拿到；演示结束后请去扣子后台重置
        var XK_SDK_TOKEN = (function () {
            try { var saved = localStorage.getItem('xk_wsdk_token'); if (saved) return saved; } catch (e) {}
            return 'YOUR_TOKEN';
        })();
        var frame = document.getElementById('frame');
        var tip = document.getElementById('tip');

        window.addEventListener('message', function (event) {
            if (event.origin !== XK_SDK_ORIGIN) return;
            var data = event.data || {};
            if (!frame.contentWindow) return;

            if (data.type === 'IFRAME_READY') {
                frame.contentWindow.postMessage({
                    type: 'INIT',
                    payload: { token: XK_SDK_TOKEN, projectId: XK_PROJECT_ID }
                }, XK_SDK_ORIGIN);
                tip.style.display = 'none';
            }
            if (data.type === 'TOKEN_EXPIRED') {
                frame.contentWindow.postMessage({
                    type: 'UPDATE_TOKEN',
                    payload: { token: XK_SDK_TOKEN }
                }, XK_SDK_ORIGIN);
            }
        });

        if (!XK_SDK_TOKEN || XK_SDK_TOKEN === 'YOUR_TOKEN') {
            tip.innerHTML = '还没有配置访问令牌<br>双击「小可SDK测试.html」填一次即可';
        } else {
            frame.src = XK_SDK_ORIGIN + '/';
        }
        setTimeout(function () { if (tip) tip.style.display = 'none'; }, 10000);
    </script>
</body>
</html>
